<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="纸船 logo">
  <!-- 白色圆角方形底板 -->
  <rect width="120" height="120" rx="18" ry="18" fill="#ffffff" stroke="#000000" stroke-opacity="0.06"/>

  <!-- 纸船主体（黑色填充，白色折痕） -->
  <g transform="translate(0,0)" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- 船身外廓 -->
    <path d="M12 60 L60 22 L108 60 L84 72 L60 52 L36 72 Z" fill="#000000" stroke="#000000" stroke-width="2"/>
    <!-- 船底阴影 -->
    <path d="M24 72 L60 96 L96 72" fill="#000000" stroke="#000000" stroke-width="2"/>
    <!-- 中央折痕（白色） -->
    <path d="M60 24 L60 92" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
    <!-- 折边高光 -->
    <path d="M36 72 L60 52 L84 72" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>