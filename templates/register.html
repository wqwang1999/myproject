<!doctype html>
<html lang="zh-cn">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>注册 - 智聊</title>
    <link rel="stylesheet" href="/static/main.css">
  </head>
  <body>
    <div class="shell">
      <div class="card">
        <div class="inner">
          <div class="brand">
            <img src="/static/logo.svg" alt="智聊">
            <div class="title">注册新用户</div>
          </div>
          {% if error %}
          <p class="tag" style="color:#ffb3b3">{{ error }}</p>
          {% endif %}
          <form method="post" class="auth-form">
            <label>用户名（仅字母）</label>
            <input name="username" required />
            <label>密码（需包含字母与数字，且长度不少于8位）</label>
            <input name="password" type="password" required minlength="8" oninvalid="this.setCustomValidity('请注意密码格式')" oninput="this.setCustomValidity('')" />
            <label>邮箱</label>
            <input name="email" type="email" required />
            <label>备注（可选）</label>
            <input name="note" />
            <div style="display:flex;gap:10px;justify-content:center;margin-top:6px">
              <button class="btn primary" type="submit">申请</button>
              <a class="btn ghost" href="/">取消</a>
            </div>
          </form>
        </div>
      </div>
    </div>
    <script src="/static/ui.js" defer></script>
    <script>
      document.addEventListener('DOMContentLoaded', function(){
        // 添加表单提交处理，防止默认提交行为并显示模态框
        const submitted = {{ 'true' if submitted else 'false' }};
        if(submitted){
          // 如果已经提交成功，则弹出浏览器对话框
          alert("申请已提交\n\n您的账号已提交审核，管理员批准后将通过邮箱告知，请您耐心等候。");
          // 跳转回首页
          window.location.href = "/";
        }
      });
    </script>
  </body>
</html>
