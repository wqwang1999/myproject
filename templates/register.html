<!doctype html>
<html lang="zh-cn">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>注册 - 智聊</title>
    <link rel="stylesheet" href="/static/main.css">
  </head>
  <body>
    <canvas id="starfield"></canvas>
    <main class="hero">
      <div class="card">
        <h1 class="logo">注册新用户</h1>
        {% if error %}
        <p class="tag" style="color:#ffb3b3">{{ error }}</p>
        {% endif %}
        <form method="post" class="auth-form">
          <label>用户名（仅字母）</label>
          <input name="username" required />
          <label>密码（需包含字母与数字）</label>
          <input name="password" type="password" required />
          <label>邮箱</label>
          <input name="email" type="email" required />
          <label>备注（可选）</label>
          <input name="note" />
          <div style="margin-top:12px;display:flex;gap:10px;justify-content:center">
            <button class="btn primary" type="submit">申请</button>
            <a class="btn ghost" href="/">取消</a>
          </div>
        </form>
      </div>
    </main>
    <script src="/static/main.js" defer></script>
    <script src="/static/ui.js" defer></script>
    <div id="submitted-modal" class="modal" style="display: none;">
      <div class="modal-card">
        <h3>申请已提交</h3>
        <p>您的账号已提交审核，管理员批准后即可登录，请耐心等候。</p>
        <div style="margin-top:12px;text-align:center">
          <a class="btn primary" href="/">返回首页</a>
        </div>
      </div>
    </div>
    <script>
      document.addEventListener('DOMContentLoaded', function(){
        const submitted = {{ 'true' if submitted else 'false' }};
        if(submitted){
          const m = document.getElementById('submitted-modal');
          if(m) m.style.display='flex';
        }
      });
    </script>
  </body>
</html>
