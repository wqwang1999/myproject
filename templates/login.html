<!doctype html>
<html lang="zh-cn">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>登录 - 智聊</title>
    <link rel="stylesheet" href="/static/main.css">
  <body>
  </head>
  <body>
    <div class="shell">
      <div class="card">
        <div class="inner">
          <div class="brand">
            <img src="/static/logo.svg" alt="智聊">
            <div class="title">欢迎体验</div>
          </div>
          {% if error %}
          <p class="tag" style="color:#ffb3b3">{{ error }}</p>
          {% endif %}
          <form method="post" class="auth-form">
            <label>用户名</label>
            <input name="username" required oninvalid="this.setCustomValidity('请填写用户名')" oninput="this.setCustomValidity('')" />
            <label>密码</label>
            <input name="password" type="password" required oninvalid="this.setCustomValidity('请填写密码')" oninput="this.setCustomValidity('')" />
            <div style="display:flex;gap:10px;justify-content:center;margin-top:6px">
              <button class="btn primary" type="submit">登录</button>
              <a class="btn primary" href="/register">注册</a>
            </div>
          </form>
        </div>
      </div>
    </div>
    <script src="/static/ui.js" defer></script>
  </body>
</html>
