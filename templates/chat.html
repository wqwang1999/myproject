<!doctype html>
<html lang="zh-cn">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>智聊 — 聊天</title>
    <link rel="stylesheet" href="/static/chat.css">
  </head>
  <body>
    <div class="shell">
      <div class="card" style="padding:18px">
        <div class="inner" style="align-items:stretch">
          <div style="display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:8px">
            <div style="display:flex;align-items:center;gap:12px">
              <img src="/static/logo.svg" alt="智聊" style="height:40px">
              <div style="font-weight:800;color:var(--accent)">智聊 — 聊天</div>
            </div>
            <div class="actions" style="justify-content:flex-end">
              <a class="btn primary" href="/dashboard">返回菜单</a>
            </div>
          </div>
          <div class="chat-app">
      <aside class="sidebar">
        <div class="brand">智聊</div>
        <div class="sessions">
          <div class="sessions-header">
            <h4>会话</h4>
            <button id="newSession" class="icon-btn">＋</button>
          </div>
          <ul id="sessionList" class="session-list"></ul>
        </div>
        <div class="sidebar-foot">版本 0.1</div>
      </aside>

      <main class="window">
        <header class="chat-header">
          <div class="title">即时聊天</div>
          <div class="sub">示例机器人，所有回复为"你好"</div>
        </header>

        <section id="messages" class="messages" aria-live="polite"></section>

        <form id="composer" class="composer" onsubmit="return false;">
          <input id="inputMsg" class="input" autocomplete="off" placeholder="输入消息，按 Enter 发送..." />
          <button id="sendBtn" class="send" type="button">发送</button>
        </form>
          </div>
        </div>
      </div>
    </div>
    <script src="/static/chat.js"></script>
  </body>
</html>
